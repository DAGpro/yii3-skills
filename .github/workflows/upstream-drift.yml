name: upstream-drift

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      fail_on_drift:
        description: 'Fail workflow if upstream Yiisoft packages have drifted from manifest SHAs'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  check-upstream-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check upstream Yiisoft package drift against API manifests
        env:
          FAIL_ON_DRIFT: ${{ inputs.fail_on_drift || 'false' }}
        run: |
          FLAGS="--upstream --markdown"
          if [ "$FAIL_ON_DRIFT" = "true" ]; then
            FLAGS="$FLAGS --fail-on-drift"
          fi
          node scripts/check-manifest-freshness.mjs $FLAGS | tee -a "$GITHUB_STEP_SUMMARY"
