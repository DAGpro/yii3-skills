name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extension validator (extension.json, SKILL.md frontmatter, guard sync, purity)
        run: node scripts/validate.mjs

      - name: Eval selftest (positive/negative samples, guide bindings)
        run: node evals/runner/selftest.mjs

      - name: AI Factory workflow end-to-end contract test
        run: node scripts/test-aif-workflow.mjs

      - name: Eval guide coverage check (100% coverage gate)
        run: node scripts/check-eval-coverage.mjs

      - name: API symbols grounding check (manifest mode on CI, package clones locally)
        run: node scripts/check-symbols.mjs

      - name: AST PHP code grounding analyzer
        run: node scripts/check-ast.mjs

  php-runtime-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Eval selftest with runtime evaluation (PHP lint & Composer validation)
        run: node evals/runner/selftest.mjs --runtime
