name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Extension validator (extension.json, SKILL.md frontmatter, injection structure, purity)
        run: node scripts/validate.mjs

      - name: Eval selftest (positive/negative samples, guide bindings)
        run: node evals/runner/selftest.mjs

      - name: AI Factory workflow end-to-end contract test
        run: node scripts/test-aif-workflow.mjs

      - name: Eval guide coverage check (100% coverage gate)
        run: node scripts/check-eval-coverage.mjs

      - name: API symbols grounding check (manifest mode on CI, package clones locally)
        run: node scripts/check-symbols.mjs --manifest-mode

      - name: AST PHP code grounding analyzer (manifest mode on CI)
        run: node scripts/check-ast.mjs --manifest-mode

      - name: API manifest provenance & cross-manifest parity check
        run: node scripts/check-manifest-freshness.mjs --max-age-days 180

  php-runtime-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, json, mbstring, dom
          tools: composer

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Eval selftest with runtime evaluation (PHP lint & Composer validation)
        run: node evals/runner/selftest.mjs --runtime

      - name: Install real Yii 3 runtime harness dependencies
        working-directory: evals/runtime-harness
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run L5 Yii 3 PHPUnit integration harness (strict)
        run: node scripts/test-php-runtime.mjs --strict
